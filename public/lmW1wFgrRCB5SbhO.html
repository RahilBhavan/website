<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<title>Notes</title>
<style>
/* Vercel/Geist-inspired tokens. Fonts come from the system only: no third-party requests on a private page. */
:root {
  --ink: #171717; --body: #4d4d4d; --mute: #737373; --hairline: #ebebeb; --hairline-strong: #a1a1a1;
  --canvas: #ffffff; --canvas-soft: #fafafa; --canvas-soft-2: #f5f5f5;
  --on-primary: #ffffff; --link: #0070f3;
  --error: #c50000; --error-soft: #fdeced;
  --ring: 0 0 0 1px #00000014;
  --shadow: 0 0 0 1px #00000014, 0 1px 1px #00000005, 0 2px 2px #0000000a;
  --shadow-lg: 0 0 0 1px #00000014, 0 1px 1px #00000005, 0 8px 16px -4px #0000000a, 0 24px 32px -8px #0000000f;
  /* stage badges: soft fill + deep text, never color alone (the label is always printed) */
  --s-drafted: #f2f2f2; --s-drafted-fg: #4d4d4d;
  --s-sent: #e6f0ff; --s-sent-fg: #0761d1;
  --s-followed-up: #efe8fb; --s-followed-up-fg: #4c2889;
  --s-replied: #dcfaf2; --s-replied-fg: #1a7a64;
  --s-scheduled: #fff4dc; --s-scheduled-fg: #8a4608;
  --s-met: #171717; --s-met-fg: #ffffff;
  --s-no-reply: #fdeced; --s-no-reply-fg: #a30000;
  --s-not-started: #f2f2f2; --s-not-started-fg: #4d4d4d;
  --s-building: #fff4dc; --s-building-fg: #8a4608;
  --s-shipped: #dcfaf2; --s-shipped-fg: #1a7a64;
  --sans: "Geist", Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --ink: #ededed; --body: #a1a1a1; --mute: #8f8f8f; --hairline: #262626; --hairline-strong: #525252;
    --canvas: #0a0a0a; --canvas-soft: #111111; --canvas-soft-2: #1a1a1a;
    --on-primary: #0a0a0a; --link: #52a8ff;
    --error: #ff6166; --error-soft: #2a1314;
    --ring: 0 0 0 1px #ffffff17;
    --shadow: 0 0 0 1px #ffffff17;
    --shadow-lg: 0 0 0 1px #ffffff17, 0 24px 32px -8px #00000080;
    --s-drafted: #1f1f1f; --s-drafted-fg: #a1a1a1;
    --s-sent: #0d1f3a; --s-sent-fg: #7ab8ff;
    --s-followed-up: #231637; --s-followed-up-fg: #c4a8f0;
    --s-replied: #0b2a23; --s-replied-fg: #50e3c2;
    --s-scheduled: #2e1f07; --s-scheduled-fg: #f5b74f;
    --s-met: #ededed; --s-met-fg: #0a0a0a;
    --s-no-reply: #2a1314; --s-no-reply-fg: #ff8a8e;
    --s-not-started: #1f1f1f; --s-not-started-fg: #a1a1a1;
    --s-building: #2e1f07; --s-building-fg: #f5b74f;
    --s-shipped: #0b2a23; --s-shipped-fg: #50e3c2;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--canvas-soft); color: var(--ink); }
body { font: 400 14px/20px var(--sans); letter-spacing: -0.28px; overflow-x: hidden; -webkit-font-smoothing: antialiased; }
::selection { background: var(--ink); color: var(--canvas); }
button, input { font: inherit; letter-spacing: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
[hidden] { display: none !important; }
.mono { font: 400 12px/16px var(--mono); letter-spacing: 0; }
.muted { color: var(--mute); }

/* buttons: in-app scale, 6px radius everywhere */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 32px; padding: 0 12px;
  border: 0; border-radius: 6px; font-weight: 500; cursor: pointer; white-space: nowrap;
  background: var(--canvas); color: var(--ink); box-shadow: var(--ring); transition: background .15s, transform .1s;
}
.btn:hover { background: var(--canvas-soft-2); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--ink); color: var(--on-primary); box-shadow: none; }
.btn.primary:hover { opacity: .88; }
.btn.sm { height: 28px; padding: 0 8px; font-size: 13px; }
.btn:disabled { opacity: .6; cursor: progress; }

/* lock screen: the only place the brand gradient appears */
#lock-screen {
  min-height: 100dvh; display: grid; place-items: center; padding: 16px; position: relative; overflow: hidden;
}
#lock-screen::before {
  content: ""; position: absolute; inset: -20% -10% auto; height: 70%; pointer-events: none; opacity: .22; filter: blur(60px);
  background:
    radial-gradient(40% 60% at 20% 50%, #007cf0, transparent 70%),
    radial-gradient(35% 55% at 50% 40%, #ff0080, transparent 70%),
    radial-gradient(40% 60% at 80% 55%, #f9cb28, transparent 70%);
}
.lock-card {
  position: relative; width: 100%; max-width: 360px; padding: 32px; border-radius: 12px;
  background: var(--canvas); box-shadow: var(--shadow-lg); display: grid; gap: 16px;
}
.lock-card h1 { margin: 0; font-size: 24px; line-height: 32px; font-weight: 600; letter-spacing: -0.96px; }
.lock-card p { margin: 0; }
.field { display: grid; gap: 8px; }
.field label { font-weight: 500; }
.input {
  height: 40px; padding: 0 12px; border-radius: 6px; border: 0; background: var(--canvas);
  box-shadow: 0 0 0 1px var(--hairline-strong); width: 100%;
}
.input:focus { outline: none; box-shadow: 0 0 0 1px var(--ink), 0 0 0 4px color-mix(in srgb, var(--ink) 12%, transparent); }
.input::placeholder { color: var(--mute); }
.lock-card .btn { height: 40px; width: 100%; }
#err { color: var(--error); min-height: 20px; }

/* app shell */
header.bar {
  position: sticky; top: 0; z-index: 10; height: 56px; border-bottom: 1px solid var(--hairline);
  background: color-mix(in srgb, var(--canvas) 85%, transparent); backdrop-filter: saturate(180%) blur(8px);
}
.wrap { max-width: 1080px; margin: 0 auto; padding: 0 24px; }
header.bar .wrap { height: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { font-weight: 600; letter-spacing: -0.6px; font-size: 16px; display: flex; align-items: baseline; gap: 12px; }
main.wrap { padding-top: 40px; padding-bottom: 64px; }
section { margin-bottom: 48px; }
h2 { margin: 0 0 16px; font-size: 20px; line-height: 28px; font-weight: 600; letter-spacing: -0.6px; }
.lead { margin: -8px 0 16px; color: var(--body); }
.hero h2 { font-size: 32px; line-height: 40px; letter-spacing: -1.28px; margin-bottom: 8px; }
.hero .lead { margin: 0 0 24px; font-size: 16px; line-height: 24px; }

.panel { background: var(--canvas); border-radius: 8px; box-shadow: var(--shadow); overflow: hidden; }

/* action queue */
.queue { list-style: none; margin: 0; padding: 0; }
.queue li { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 12px 16px; }
.queue li + li { border-top: 1px solid var(--hairline); }
.queue .main { flex: 1 1 260px; display: grid; gap: 2px; min-width: 0; }
.queue .who { font-weight: 500; }
.queue .what { color: var(--body); }
.queue .when { text-align: right; white-space: nowrap; }
.queue li.waiting .what, .queue li.waiting .when { color: var(--mute); }
.queue li.late .when { color: var(--error); }
.empty { padding: 32px 16px; text-align: center; color: var(--body); background: var(--canvas-soft); }

/* pipeline strip */
.stats { display: grid; grid-template-columns: repeat(4, 1fr); }
.stat { padding: 16px; display: grid; gap: 8px; align-content: start; border-right: 1px solid var(--hairline); border-bottom: 1px solid var(--hairline); }
.stat:nth-child(4n) { border-right: 0; }
.stat:nth-last-child(-n+4) { border-bottom: 0; }
.stat b { font-size: 24px; line-height: 32px; font-weight: 600; letter-spacing: -0.96px; font-variant-numeric: tabular-nums; }
.stat.key { background: var(--canvas-soft); }

.badge {
  display: inline-flex; align-items: center; height: 20px; padding: 0 8px; border-radius: 9999px;
  font: 500 12px/16px var(--sans); letter-spacing: 0; white-space: nowrap; justify-self: start;
  background: var(--s-drafted); color: var(--s-drafted-fg);
}

/* connections */
.toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 12px; }
.toolbar .input { height: 32px; max-width: 260px; flex: 1 1 200px; }
.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.tab {
  height: 32px; padding: 0 12px; border: 0; border-radius: 6px; background: transparent; color: var(--body);
  cursor: pointer; white-space: nowrap;
}
.tab:hover { color: var(--ink); background: var(--canvas-soft-2); }
.tab[aria-pressed="true"] { color: var(--ink); background: var(--canvas); box-shadow: var(--ring); font-weight: 500; }
.tab .n { color: var(--mute); margin-left: 4px; font: 400 12px/16px var(--mono); }
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; min-width: 720px; }
th {
  text-align: left; padding: 8px 12px; background: var(--canvas-soft); border-bottom: 1px solid var(--hairline);
  font: 400 12px/16px var(--mono); color: var(--mute); text-transform: uppercase; letter-spacing: 0; white-space: nowrap;
}
td { padding: 12px; border-bottom: 1px solid var(--hairline); vertical-align: middle; white-space: nowrap; }
tr.detail td { white-space: normal; }
td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
tbody tr:last-child td { border-bottom: 0; }
tr.row:hover td { background: var(--canvas-soft); }
.expander {
  all: unset; cursor: pointer; font-weight: 500; display: inline-flex; align-items: center; gap: 8px; border-radius: 4px;
}
.expander:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
.chev { width: 16px; color: var(--mute); transition: transform .15s; display: inline-block; text-align: center; }
.expander[aria-expanded="true"] .chev { transform: rotate(90deg); }
tr.detail td { background: var(--canvas-soft); padding: 16px 16px 24px 40px; }
.secs { display: grid; gap: 16px; max-width: min(760px, calc(100vw - 88px)); }
.sec-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; }
.sec-head h3 { margin: 0; font-size: 14px; font-weight: 500; }
pre.sec {
  margin: 0; padding: 12px 16px; white-space: pre-wrap; overflow-wrap: anywhere; border-radius: 8px;
  background: var(--canvas); box-shadow: var(--ring); font: 400 13px/20px var(--mono); color: var(--body);
}
.late-text { color: var(--error); }

/* status dropdown: native select (keyboard + mobile pickers for free), tinted like the badges */
.pick { position: relative; display: inline-flex; }
.pick select {
  appearance: none; -webkit-appearance: none; height: 28px; padding: 0 28px 0 10px; border: 0; border-radius: 6px;
  font: 500 13px/16px var(--sans); letter-spacing: 0; cursor: pointer;
  background: var(--s-drafted); color: var(--s-drafted-fg); box-shadow: inset 0 0 0 1px #0000000d;
}
.pick::after {
  content: ""; position: absolute; right: 11px; top: 10px; width: 5px; height: 5px; pointer-events: none;
  border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; transform: rotate(45deg); opacity: .7;
}
.pick select option { background: var(--canvas); color: var(--ink); }
.pick.pending select { box-shadow: 0 0 0 1.5px var(--link); }
.sub { display: block; margin-top: 4px; }
.date { height: 28px; padding: 0 8px; border: 0; border-radius: 6px; background: var(--canvas); box-shadow: var(--ring); font-size: 13px; }

.notice {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px;
  padding: 12px 16px; margin-bottom: 32px; border-radius: 8px; background: var(--canvas); box-shadow: 0 0 0 1px var(--link);
}
.notice p { margin: 0; }
.toast {
  position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 20; padding: 8px 16px; border-radius: 8px;
  background: var(--ink); color: var(--canvas); box-shadow: var(--shadow-lg); font-weight: 500;
}

/* projects */
.projects { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
.project { padding: 24px; display: grid; gap: 12px; align-content: start; }
.project .title { font-size: 16px; line-height: 24px; font-weight: 600; letter-spacing: -0.32px; }
.project .meta { display: flex; gap: 12px; align-items: center; }
.project a { color: var(--link); text-decoration: none; overflow-wrap: anywhere; }
.project a:hover { text-decoration: underline; }

footer { border-top: 1px solid var(--hairline); padding: 24px 0 40px; color: var(--mute); }

@media (max-width: 720px) {
  .wrap { padding: 0 16px; }
  main.wrap { padding-top: 24px; }
  .hero h2 { font-size: 24px; line-height: 32px; letter-spacing: -0.96px; }
  .stats { grid-template-columns: repeat(2, 1fr); }
  .stat:nth-child(4n) { border-right: 1px solid var(--hairline); }
  .stat:nth-child(2n) { border-right: 0; }
  .stat:nth-last-child(-n+4) { border-bottom: 1px solid var(--hairline); }
  .stat:nth-last-child(-n+2) { border-bottom: 0; }
  .toolbar .input { max-width: none; }
  tr.detail td { padding-left: 16px; }
  .secs { max-width: calc(100vw - 64px); }
  .brand .mono { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>

<script>
"use strict";
(function () {
  const STATUSES = ["new", "drafted", "sent", "followed-up", "replied", "scheduled", "met", "no-reply"];
  const LABELS = {
    new: "New lead", drafted: "Drafted", sent: "Sent, waiting", "followed-up": "Followed up, waiting", replied: "Replied",
    scheduled: "Chat scheduled", met: "Met", "no-reply": "No reply",
    "not-started": "Not started", building: "Building", shipped: "Shipped",
  };
  const STORE = "networking-dashboard-local";
  const lockScreen = document.getElementById("lock-screen");
  const form = document.getElementById("unlock");
  const passEl = document.getElementById("pass");
  const errEl = document.getElementById("err");
  const app = document.getElementById("app");
  let data = null;                      // decrypted build: { generated, connections }
  let local = {};                       // edits made here, by file: { status, sent?, followup_due?, chat_date? }
  let localKey = null, localSalt = null;
  const view = { q: "", status: "all", open: new Set() };

  const enc = s => new TextEncoder().encode(s);
  const dec = b => new TextDecoder().decode(b);
  function b64(s) { return Uint8Array.from(atob(s), c => c.charCodeAt(0)); }
  function toB64(u8) { let s = ""; for (const x of u8) s += String.fromCharCode(x); return btoa(s); }
  function readStore() { try { return JSON.parse(localStorage.getItem(STORE)); } catch (_) { return null; } }

  async function unlock(pass) {
    const blob = JSON.parse(document.getElementById("blob").textContent);
    const saved = readStore();
    const subtle = crypto.subtle;
    const base = await subtle.importKey("raw", enc(pass), "PBKDF2", false, ["deriveKey"]);
    const derive = salt => subtle.deriveKey({ name: "PBKDF2", salt, iterations: blob.iter, hash: "SHA-256" },
      base, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
    // Local edits keep their own salt: the build's salt changes on every deploy and the edits must outlive it.
    const salt = saved && saved.salt ? b64(saved.salt) : crypto.getRandomValues(new Uint8Array(16));
    const [key, lkey] = await Promise.all([derive(b64(blob.salt)), derive(salt)]);
    const pt = await subtle.decrypt({ name: "AES-GCM", iv: b64(blob.iv) }, key, b64(blob.ct));
    data = JSON.parse(dec(pt));
    localKey = lkey; localSalt = salt; local = {};
    if (saved && saved.ct) {
      try { local = JSON.parse(dec(await subtle.decrypt({ name: "AES-GCM", iv: b64(saved.iv) }, lkey, b64(saved.ct)))); }
      catch (_) { local = {}; } // written under another passphrase; the next edit replaces it
    }
    // Drop edits the markdown files have caught up with.
    let pruned = false;
    for (const f of Object.keys(local)) {
      const c = (data.connections || []).find(x => x.file === f);
      if (!c || Object.keys(local[f]).every(k => k === "status" ? c.status === local[f].status : !!c[k])) { delete local[f]; pruned = true; }
    }
    if (pruned) await saveLocal();
  }

  async function saveLocal() {
    try {
      if (!Object.keys(local).length) { localStorage.removeItem(STORE); return true; }
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const ct = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, localKey, enc(JSON.stringify(local))));
      localStorage.setItem(STORE, JSON.stringify({ salt: toB64(localSalt), iv: toB64(iv), ct: toB64(ct) }));
      return true;
    } catch (_) { return false; }
  }

  function connections() {
    return (data.connections || []).map(c => local[c.file] ? Object.assign({}, c, local[c.file], { local: true }) : c);
  }

  // Tiny DOM builder; strings always become text nodes, never HTML.
  function el(tag, attrs, ...kids) {
    const n = document.createElement(tag);
    for (const k in attrs || {}) {
      if (k === "class") n.className = attrs[k];
      else if (k === "style") n.style.cssText = attrs[k];
      else if (k.startsWith("on")) n.addEventListener(k.slice(2), attrs[k]);
      else n.setAttribute(k, attrs[k]);
    }
    for (const c of kids.flat(Infinity)) if (c != null && c !== false) n.append(c instanceof Node ? c : String(c));
    return n;
  }

  function tint(s) {
    const k = (s || "").replace(/[^a-z-]/g, "");
    return k ? `background: var(--s-${k}, var(--s-drafted)); color: var(--s-${k}-fg, var(--s-drafted-fg))` : "";
  }
  function label(s) { return LABELS[s] || (s ? s.replace(/-/g, " ") : "No status"); }
  function badge(s) { return el("span", { class: "badge", style: tint(s) }, label(s)); }

  function todayStr() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  }

  // Same rule as build.js: follow up 5 business days after sending.
  function addBusinessDays(ymd, n) {
    const d = new Date(ymd + "T00:00:00Z");
    while (n > 0) { d.setUTCDate(d.getUTCDate() + 1); const wd = d.getUTCDay(); if (wd !== 0 && wd !== 6) n--; }
    return d.toISOString().slice(0, 10);
  }

  // Whole days from `from` to `to` (both YYYY-MM-DD); NaN if either is bad.
  function days(from, to) { return Math.round((Date.parse(to + "T00:00:00Z") - Date.parse(from + "T00:00:00Z")) / 864e5); }

  function shortDate(ymd) {
    const t = Date.parse(ymd + "T00:00:00Z");
    return isNaN(t) ? ymd || "" : new Date(t).toLocaleDateString(undefined, { month: "short", day: "numeric", timeZone: "UTC" });
  }

  function relDate(ymd, today) {
    const d = days(today, ymd);
    if (isNaN(d)) return ymd || "";
    if (d === 0) return "today";
    if (d === 1) return "tomorrow";
    if (d === -1) return "yesterday";
    return d > 0 ? `in ${d} days` : `${-d} days ago`;
  }

  function safeHref(u) {
    if (!u) return null;
    const url = /^https?:\/\//i.test(u) ? u : "https://" + u;
    try { return new URL(url).protocol.startsWith("http") ? url : null; } catch (_) { return null; }
  }

  function plural(n, w) { return `${n} ${w}${n === 1 ? "" : "s"}`; }

  let toastTimer = null;
  function toast(msg) {
    let t = document.querySelector(".toast");
    if (!t) { t = el("div", { class: "toast", role: "status" }); document.body.append(t); }
    t.textContent = msg;
    t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.hidden = true; }, 2400);
  }

  async function edit(file, change, where) {
    const base = data.connections.find(c => c.file === file);
    const o = Object.assign({}, local[file] || {}, change);
    if (!o.status) o.status = base.status;
    if ((o.status === "sent" || o.status === "followed-up") && !base.sent && !o.sent) {
      o.sent = todayStr();
      o.followup_due = addBusinessDays(o.sent, 5);
    }
    // Picking the status the files already have undoes the local edit (including any date it added).
    if (change.status === base.status || Object.keys(o).every(k => base[k] === o[k])) delete local[file];
    else local[file] = o;
    const saved = await saveLocal();
    render();
    const again = app.querySelector(`[data-pick="${CSS.escape(where + ":" + file)}"]`);
    if (again) again.focus({ preventScroll: true });
    toast(saved ? `${base.name || file}: ${label(o.status)}` : "Changed for now. This browser won't keep it (private mode?).");
  }

  function statusPicker(c, where) {
    const known = STATUSES.includes(c.status);
    const sel = el("select", { "aria-label": `Status for ${c.name || c.file}`, "data-pick": where + ":" + c.file, style: tint(c.status),
      onchange: e => edit(c.file, { status: e.target.value }, where) },
      known ? null : el("option", { value: c.status || "" }, label(c.status)),
      STATUSES.map(s => el("option", { value: s }, LABELS[s])));
    sel.value = c.status || "";
    return el("span", { class: "pick" + (c.local ? " pending" : ""), title: c.local ? "Changed in this browser, not in the files yet" : "" }, sel);
  }

  function renderNotice(cs) {
    const changed = cs.filter(c => c.local);
    if (!changed.length) return null;
    const lines = changed.map(c => `${c.file}: ` + Object.entries(local[c.file]).map(([k, v]) => `${k}: ${v}`).join(", "));
    const text = "Update these connection headers:\n" + lines.join("\n");
    const btn = el("button", { class: "btn sm", type: "button", onclick: async () => {
      try { await navigator.clipboard.writeText(text); toast("Copied. Paste it to Claude to update the files."); }
      catch (_) { toast("Copy failed."); }
    } }, "Copy changes");
    return el("div", { class: "notice" },
      el("p", null, `${plural(changed.length, "change")} saved only in this browser. `,
        el("span", { class: "muted" }, `Copy ${changed.length === 1 ? "it" : "them"} into the files so the next build keeps ${changed.length === 1 ? "it" : "them"}.`)), btn);
  }

  function renderQueue(cs, today) {
    const items = [];
    for (const c of cs) {
      const add = (rank, date, what, when, extra) => items.push(Object.assign({ c, rank, date: date || "9999", what, when }, extra));
      if (c.status === "replied") add(0, c.sent, "They replied. Book a time.", "");
      else if (c.status === "sent" && c.followup_due && c.followup_due <= today)
        add(0, c.followup_due, "Send the follow-up", c.followup_due < today ? `${-days(today, c.followup_due)} days overdue` : "due today",
          { late: c.followup_due < today });
      else if (c.status === "scheduled" && !c.chat_date) add(1, "", "Chat scheduled. Add the date below.", "");
      else if (c.status === "scheduled" && c.chat_date >= today)
        add(1, c.chat_date, "Coffee chat", `${shortDate(c.chat_date)}, ${relDate(c.chat_date, today)}`);
      else if (c.status === "drafted" && c.project_status !== "shipped")
        add(2, "", c.project ? `Finish project: ${c.project}` : "Pick a project", c.project_status ? badge(c.project_status) : "");
      else if (c.status === "drafted") add(2, "", "Project shipped. Ready to send.", "");
      else if (c.status === "sent")
        add(3, c.followup_due, `Waiting on a reply, sent ${relDate(c.sent, today)}`, c.followup_due ? `follow up ${relDate(c.followup_due, today)}` : "", { waiting: true });
      else if (c.status === "followed-up")
        add(3, c.sent, `Followed up, waiting on a reply`, c.sent ? `first sent ${shortDate(c.sent)}` : "", { waiting: true });
    }
    items.sort((a, b) => a.rank - b.rank || a.date.localeCompare(b.date));
    const count = f => items.filter(f).length;
    const parts = [];
    const late = count(i => i.late), replies = count(i => i.c.status === "replied"), waiting = count(i => i.waiting);
    if (late) parts.push(`${plural(late, "follow-up")} overdue`);
    if (replies) parts.push(`${plural(replies, "reply")} to answer`.replace("replys", "replies"));
    if (waiting) parts.push(`${waiting} waiting on a reply`);
    const lead = parts.length ? parts.join(", ") + "." : items.length ? `${plural(items.length, "thing")} to do.` : "You're caught up.";
    return el("section", { class: "hero" },
      el("h2", null, "Next up."),
      el("p", { class: "lead" }, lead),
      el("div", { class: "panel" }, items.length
        ? el("ul", { class: "queue" }, items.map(i => el("li", { class: i.late ? "late" : i.waiting ? "waiting" : "" },
            el("div", { class: "main" },
              el("span", { class: "who" }, i.c.name || i.c.file, i.c.company ? el("span", { class: "muted" }, ` at ${i.c.company}`) : null),
              el("span", { class: "what" }, i.what)),
            i.when ? el("span", { class: "when" }, i.when) : null,
            statusPicker(i.c, "q"))))
        : el("div", { class: "empty" }, "No follow-ups due, no chats booked, no drafts waiting. Add a connection to start.")));
  }

  function renderPipeline(cs) {
    const n = s => cs.filter(c => c.status === s).length;
    const denom = cs.filter(c => c.status !== "drafted" && c.status !== "new").length;
    const rate = denom ? Math.round(100 * (n("replied") + n("scheduled") + n("met")) / denom) + "%" : "n/a";
    return el("section", null,
      el("h2", null, "Pipeline"),
      el("div", { class: "panel stats" },
        STATUSES.map(s => el("div", { class: "stat" }, el("b", null, n(s)), badge(s))),
        el("div", { class: "stat key" }, el("b", null, rate), el("span", { class: "mono muted" }, "reply rate"))));
  }

  function renderSection(sec) {
    const text = sec.text.replace(/\*\*/g, "");
    const btn = el("button", { class: "btn sm", type: "button", onclick: async () => {
      try { await navigator.clipboard.writeText(text); btn.textContent = "Copied"; }
      catch (_) { btn.textContent = "Copy failed"; }
      setTimeout(() => { btn.textContent = "Copy"; }, 1500);
    } }, "Copy");
    return el("div", null, el("div", { class: "sec-head" }, el("h3", null, sec.title), btn), el("pre", { class: "sec" }, text));
  }

  function nextCell(c, today) {
    if (c.status === "scheduled")
      return el("td", null, el("input", { class: "date", type: "date", value: c.chat_date || "", "aria-label": `Chat date with ${c.name || c.file}`,
        "data-pick": "d:" + c.file, onchange: e => edit(c.file, { chat_date: e.target.value }, "d") }));
    if ((c.status === "sent" || c.status === "followed-up") && c.followup_due) {
      const late = c.status === "sent" && c.followup_due < today;
      return el("td", { class: "num" + (late ? " late-text" : "") }, shortDate(c.followup_due),
        el("span", { class: "sub mono " + (late ? "" : "muted") }, c.status === "sent" ? (late ? "follow-up overdue" : "follow up " + relDate(c.followup_due, today)) : "followed up"));
    }
    return el("td", { class: "muted" }, "");
  }

  function connRows(cs, today) {
    const q = view.q.trim().toLowerCase();
    const shown = cs.filter(c => (view.status === "all" || c.status === view.status) &&
      (!q || [c.name, c.company, c.role, c.project].join(" ").toLowerCase().includes(q)));
    if (!shown.length) return [el("tr", null, el("td", { colspan: 6 }, el("div", { class: "empty" }, "No connections match.")))];
    return shown.flatMap((c, i) => {
      const id = "detail-" + i;
      const open = view.open.has(c.file);
      const detail = el("tr", { class: "detail", id },
        el("td", { colspan: 6 }, el("div", { class: "secs" },
          (c.sections || []).length ? c.sections.map(renderSection) : el("p", { class: "muted" }, "No notes."))));
      detail.hidden = !open;
      const toggle = el("button", { class: "expander", type: "button", "aria-expanded": String(open), "aria-controls": id, onclick: () => {
        detail.hidden = !detail.hidden;
        if (detail.hidden) view.open.delete(c.file); else view.open.add(c.file);
        toggle.setAttribute("aria-expanded", String(!detail.hidden));
      } }, el("span", { class: "chev", "aria-hidden": "true" }, "›"), c.name || c.file);
      return [el("tr", { class: "row" },
        el("td", null, toggle), el("td", null, statusPicker(c, "t")),
        el("td", null, c.company, c.role ? el("span", { class: "sub muted" }, c.role) : null),
        el("td", { class: "num" }, shortDate(c.sent), c.sent ? el("span", { class: "sub mono muted" }, relDate(c.sent, today)) : null),
        nextCell(c, today),
        el("td", { class: "muted" }, c.project)), detail];
    });
  }

  function renderConnections(cs, today) {
    const body = el("tbody", null, connRows(cs, today));
    const refresh = () => body.replaceChildren(...connRows(cs, today));
    const present = STATUSES.filter(s => cs.some(c => c.status === s));
    if (view.status !== "all" && !present.includes(view.status)) view.status = "all";
    const tabs = ["all", ...present].map(s => {
      const b = el("button", { class: "tab", type: "button", "aria-pressed": String(view.status === s), onclick: () => {
        view.status = s;
        for (const t of tabs) t.setAttribute("aria-pressed", String(t === b));
        refresh();
      } }, s === "all" ? "All" : label(s),
        el("span", { class: "n" }, s === "all" ? cs.length : cs.filter(c => c.status === s).length));
      return b;
    });
    const search = el("input", { class: "input", type: "search", placeholder: "Search name, company, project",
      "aria-label": "Search connections", value: view.q, oninput: e => { view.q = e.target.value; refresh(); } });
    const cols = ["Name", "Status", "Company", "Sent", "Next", "Project"];
    return el("section", null,
      el("h2", null, "Connections"),
      el("div", { class: "toolbar" }, search, el("div", { class: "tabs", role: "group", "aria-label": "Filter by status" }, tabs)),
      el("div", { class: "panel table-wrap" }, el("table", null,
        el("thead", null, el("tr", null, cols.map(h => el("th", { scope: "col" }, h)))), body)));
  }

  function renderProjects(cs) {
    const ps = cs.filter(c => c.project);
    const owed = ps.filter(c => c.project_status !== "shipped").reduce((t, c) => t + (parseFloat(c.project_hours) || 0), 0);
    return el("section", null,
      el("h2", null, "Projects"),
      el("p", { class: "lead" }, !ps.length ? "" : owed ? `${owed} hours of building left.` : "Every project has shipped."),
      ps.length ? el("div", { class: "projects" }, ps.map(c => {
        const href = safeHref(c.project_link);
        return el("div", { class: "panel project" },
          el("div", { class: "title" }, c.project),
          el("div", { class: "muted" }, "For ", c.name, c.company ? `, ${c.company}` : ""),
          el("div", { class: "meta" }, badge(c.project_status), c.project_hours ? el("span", { class: "mono muted" }, `${c.project_hours} h`) : null),
          href ? el("a", { href, target: "_blank", rel: "noopener noreferrer" }, c.project_link) : null);
      })) : el("div", { class: "panel empty" }, "No projects yet. Add a project line to a connection's header."));
  }

  function render() {
    const cs = connections();
    const today = todayStr();
    const gen = new Date(data.generated);
    app.replaceChildren(
      el("header", { class: "bar" }, el("div", { class: "wrap" },
        el("div", { class: "brand" }, "Networking", el("span", { class: "mono muted" }, plural(cs.length, "connection"))),
        el("button", { class: "btn", type: "button", onclick: lock }, "Lock"))),
      el("main", { class: "wrap" },
        renderNotice(cs), renderQueue(cs, today), renderPipeline(cs), renderConnections(cs, today), renderProjects(cs)),
      el("footer", null, el("div", { class: "wrap mono" },
        "Built " + gen.toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" }))));
    lockScreen.hidden = true;
    app.hidden = false;
  }

  function lock() {
    data = null; local = {}; localKey = null; localSalt = null;
    view.q = ""; view.status = "all"; view.open.clear();
    const t = document.querySelector(".toast");
    if (t) t.remove();
    app.replaceChildren();
    app.hidden = true;
    lockScreen.hidden = false;
    passEl.value = "";
    errEl.textContent = "";
    passEl.focus();
  }

  form.addEventListener("submit", async ev => {
    ev.preventDefault();
    errEl.textContent = "";
    const btn = form.querySelector("button");
    btn.disabled = true;
    btn.textContent = "Decrypting...";
    try {
      await unlock(passEl.value);
      passEl.value = "";
      render();
    } catch (_) {
      data = null;
      errEl.textContent = "Wrong passphrase.";
      passEl.select();
    } finally {
      btn.disabled = false;
      btn.textContent = "Unlock";
    }
  });
})();
</script>
</body>
</html>
