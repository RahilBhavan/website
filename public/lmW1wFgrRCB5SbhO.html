<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>Notes</title>
<style>
:root {
  --bg: #f7f7f8; --fg: #1b1b1f; --muted: #6b6b76; --card: #ffffff; --line: #e3e3e8;
  --accent: #2f5bd3; --warn: #b3261e; --warn-bg: #fdecea;
  --p-drafted: #8a8a94; --p-sent: #2f5bd3; --p-followed-up: #7a4fd0; --p-replied: #0e8a6a;
  --p-scheduled: #b26b00; --p-met: #1f7a1f; --p-no-reply: #9a3b3b;
  --p-not-started: #8a8a94; --p-building: #b26b00; --p-shipped: #1f7a1f;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #131316; --fg: #e8e8ec; --muted: #9a9aa6; --card: #1d1d22; --line: #2e2e36;
    --accent: #8aa8ff; --warn: #ff8a80; --warn-bg: #3a1d1b;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--fg); }
body {
  font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  overflow-x: hidden;
}
main { max-width: 960px; margin: 0 auto; padding: 16px; }
h1 { font-size: 1.3rem; margin: 8px 0 16px; }
h2 { font-size: 1.1rem; margin: 28px 0 10px; }
h3 { font-size: .95rem; margin: 14px 0 6px; color: var(--muted); }
button, input { font: inherit; }
button {
  background: var(--accent); color: #fff; border: 0; border-radius: 6px; padding: 8px 14px; cursor: pointer;
}
button.ghost { background: transparent; color: var(--accent); border: 1px solid var(--line); padding: 4px 10px; font-size: .85rem; }
#lock-screen { min-height: 90vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
#lock-screen form { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 320px; }
#lock-screen input {
  padding: 10px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); color: var(--fg);
}
#err { color: var(--warn); min-height: 1.5em; font-size: .9rem; margin: 0; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
ul.list { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.muted { color: var(--muted); }
.overdue { color: var(--warn); background: var(--warn-bg); border-color: var(--warn); }
.pill {
  display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: .8rem; color: #fff;
  background: var(--muted); white-space: nowrap;
}
.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px; }
.stats .card { text-align: center; }
.stats b { display: block; font-size: 1.4rem; }
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--card); }
table { border-collapse: collapse; width: 100%; min-width: 640px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: .8rem; color: var(--muted); font-weight: 600; }
tr.row { cursor: pointer; }
tr.row:hover { background: var(--bg); }
tr.detail td { background: var(--bg); }
.detail-inner { max-width: calc(100vw - 56px); }
pre.sec {
  white-space: pre-wrap; word-wrap: break-word; margin: 0; padding: 10px; border: 1px solid var(--line);
  border-radius: 6px; background: var(--card); font: .85rem/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
}
.sec-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.projects { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
.projects a { color: var(--accent); word-break: break-all; }
footer { display: flex; justify-content: space-between; align-items: center; margin: 32px 0 8px; font-size: .8rem; color: var(--muted); }
[hidden] { display: none !important; }
</style>
</head>

  <form id="unlock" autocomplete="off">
    <input id="pass" type="password" placeholder="Passphrase" aria-label="Passphrase" required autofocus>
    <button type="submit">Unlock</button>
    <p id="err" role="alert"></p>
  </form>
</div>

<script>
"use strict";
(function () {
  const STATUSES = ["drafted", "sent", "followed-up", "replied", "scheduled", "met", "no-reply"];
  const lockScreen = document.getElementById("lock-screen");
  const form = document.getElementById("unlock");
  const passEl = document.getElementById("pass");
  const errEl = document.getElementById("err");
  const app = document.getElementById("app");
  let data = null;

  function b64(s) { return Uint8Array.from(atob(s), c => c.charCodeAt(0)); }

  async function decrypt(pass) {
    const blob = JSON.parse(document.getElementById("blob").textContent);
    const subtle = crypto.subtle;
    const base = await subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
    const key = await subtle.deriveKey({ name: "PBKDF2", salt: b64(blob.salt), iterations: blob.iter, hash: "SHA-256" },
      base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    const pt = await subtle.decrypt({ name: "AES-GCM", iv: b64(blob.iv) }, key, b64(blob.ct));
    return JSON.parse(new TextDecoder().decode(pt));
  }

  // Tiny DOM builder; strings always become text nodes, never HTML.
  function el(tag, attrs, ...kids) {
    const n = document.createElement(tag);
    for (const k in attrs || {}) {
      if (k === "class") n.className = attrs[k];
      else if (k === "style") n.style.cssText = attrs[k];
      else if (k.startsWith("on")) n.addEventListener(k.slice(2), attrs[k]);
      else n.setAttribute(k, attrs[k]);
    }
    for (const c of kids.flat(Infinity)) if (c != null && c !== false) n.append(c instanceof Node ? c : String(c));
    return n;
  }

  function pill(s) {
    return el("span", { class: "pill", style: s ? `background: var(--p-${s.replace(/[^a-z-]/g, "")}, var(--muted))` : "" }, s || "none");
  }

  function todayStr() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  }

  function safeHref(u) {
    if (!u) return null;
    const url = /^https?:\/\//i.test(u) ? u : "https://" + u;
    try { return new URL(url).protocol.startsWith("http") ? url : null; } catch (_) { return null; }
  }

  function renderToday(cs, today) {
    const due = cs.filter(c => c.status === "sent" && c.followup_due && c.followup_due <= today)
      .sort((a, b) => a.followup_due.localeCompare(b.followup_due));
    const chats = cs.filter(c => c.status === "scheduled" && c.chat_date && c.chat_date >= today)
      .sort((a, b) => a.chat_date.localeCompare(b.chat_date));
    const waiting = cs.filter(c => c.status === "drafted" && c.project_status !== "shipped");
    const group = (title, items, line) => [
      el("h3", null, title),
      items.length ? el("ul", { class: "list" }, items.map(line)) : el("p", { class: "muted" }, "Nothing here."),
    ];
    return [
      el("h2", null, "Today"),
      group("Follow-ups due", due, c => el("li", { class: "card" + (c.followup_due < today ? " overdue" : "") },
        el("b", null, c.name), ` · ${c.company || ""} · due ${c.followup_due}`, c.followup_due < today ? " (overdue)" : "")),
      group("Upcoming chats", chats, c => el("li", { class: "card" }, el("b", null, c.name), ` · ${c.company || ""} · ${c.chat_date}`)),
      group("Drafts waiting on a project", waiting, c => el("li", { class: "card" },
        el("b", null, c.name), ` · ${c.project || "no project"} `, pill(c.project_status))),
    ];
  }

  function renderPipeline(cs) {
    const n = s => cs.filter(c => c.status === s).length;
    const denom = cs.filter(c => c.status !== "drafted").length;
    const rate = denom ? Math.round(100 * (n("replied") + n("scheduled") + n("met")) / denom) + "%" : "n/a";
    return [
      el("h2", null, "Pipeline"),
      el("div", { class: "stats" },
        STATUSES.map(s => el("div", { class: "card" }, el("b", null, n(s)), pill(s))),
        el("div", { class: "card" }, el("b", null, rate), el("span", { class: "muted" }, "reply rate"))),
    ];
  }

  function renderSection(sec) {
    const pre = el("pre", { class: "sec" });
    pre.textContent = sec.text.replace(/\*\*/g, "");
    const btn = el("button", { class: "ghost", type: "button", onclick: async ev => {
      ev.stopPropagation();
      try { await navigator.clipboard.writeText(pre.textContent); btn.textContent = "Copied"; }
      catch (_) { btn.textContent = "Copy failed"; }
      setTimeout(() => { btn.textContent = "Copy"; }, 1500);
    } }, "Copy");
    return el("div", null, el("div", { class: "sec-head" }, el("h3", null, sec.title), btn), pre);
  }

  function renderConnections(cs) {
    const cols = ["Name", "Company", "Role", "Status", "Sent", "Follow-up due", "Project"];
    const body = el("tbody");
    for (const c of cs) {
      const detail = el("tr", { class: "detail", hidden: "" },
        el("td", { colspan: cols.length }, el("div", { class: "detail-inner" },
          (c.sections || []).length ? c.sections.map(renderSection) : el("p", { class: "muted" }, "No notes."))));
      const row = el("tr", { class: "row", onclick: () => { detail.hidden = !detail.hidden; } },
        el("td", null, el("b", null, c.name || c.file)), el("td", null, c.company), el("td", null, c.role),
        el("td", null, pill(c.status)), el("td", null, c.sent), el("td", null, c.followup_due), el("td", null, c.project));
      body.append(row, detail);
    }
    return [
      el("h2", null, "Connections"),
      el("div", { class: "table-wrap" }, el("table", null,
        el("thead", null, el("tr", null, cols.map(h => el("th", null, h)))), body)),
    ];
  }

  function renderProjects(cs) {
    const ps = cs.filter(c => c.project);
    const owed = ps.filter(c => c.project_status !== "shipped").reduce((t, c) => t + (parseFloat(c.project_hours) || 0), 0);
    return [
      el("h2", null, "Projects"),
      el("p", null, "Hours still owed: ", el("b", null, owed)),
      ps.length ? el("div", { class: "projects" }, ps.map(c => {
        const href = safeHref(c.project_link);
        return el("div", { class: "card" },
          el("b", null, c.project), el("div", { class: "muted" }, c.name),
          el("div", null, pill(c.project_status), c.project_hours ? ` ${c.project_hours} h` : ""),
          href ? el("div", null, el("a", { href, target: "_blank", rel: "noopener noreferrer" }, c.project_link)) : null);
      })) : el("p", { class: "muted" }, "No projects."),
    ];
  }

  function render() {
    const cs = data.connections || [];
    const today = todayStr();
    app.replaceChildren(
      el("h1", null, "Dashboard"),
      ...[renderToday(cs, today), renderPipeline(cs), renderConnections(cs), renderProjects(cs)].flat(Infinity),
      el("footer", null, el("span", null, "Generated " + new Date(data.generated).toLocaleString()),
        el("button", { type: "button", onclick: lock }, "Lock")));
    lockScreen.hidden = true;
    app.hidden = false;
  }

  function lock() {
    data = null;
    app.replaceChildren();
    app.hidden = true;
    lockScreen.hidden = false;
    passEl.value = "";
    errEl.textContent = "";
    passEl.focus();
  }

  form.addEventListener("submit", async ev => {
    ev.preventDefault();
    errEl.textContent = "";
    const btn = form.querySelector("button");
    btn.disabled = true;
    try {
      data = await decrypt(passEl.value);
      passEl.value = "";
      render();
    } catch (_) {
      errEl.textContent = "Wrong passphrase.";
      passEl.select();
    } finally {
      btn.disabled = false;
    }
  });
})();
</script>
</body>
</html>
